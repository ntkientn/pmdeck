<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM Deck - Trạm Điều Hành Quản Lý Dự Án</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230f172a'/><text x='50' y='78' font-family='Arial, sans-serif' font-weight='900' font-size='76' letter-spacing='-4' fill='%2322d3ee' text-anchor='middle'>PM</text></svg>">
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body ontouchstart="">

    <!-- DIGITAL WEBNET BACKGROUND EFFECT -->
    <div class="cyber-bg-system">
        <div class="digital-grid"></div>
        <div class="mouse-glow-pointer" id="mouseGlow"></div>
        <div class="network-stream line-1"></div>
        <div class="network-stream line-2"></div>
    </div>

    <div class="container">
        <!-- BACK TO WEB NET PAGE -->
        <a href="https://ntkientn.github.io/webnet/" class="back-to-hub">
            <i class="fa-solid fa-arrow-left"></i> Back to WebNet 
        </a>

        <!-- BOARD HEADER -->
        <header>
            <div class="header-title">
                <h1><i class="fa-solid fa-sliders"></i> PM Deck</h1>
                <p>Trạm điều hành hỗ trợ quản lý dự án, từ cố vấn process, tools & techniques, tra cứu kiến thức, đến cung cấp ứng dụng tính toán, tài nguyên, form mẫu cho PM thực chiến.</p>
            </div>
            <div class="header-counter">
                <div class="counter-value" id="activeCounter">0/0</div>
                <div class="counter-label">Modules Ready</div>
            </div>
        </header>

        <!-- MOBILE TABS NAVIGATION -->
        <div class="mobile-tabs-container">
            <div class="mobile-tabs" id="mobileTabs">
                <!-- Nút Tab sẽ được sinh tự động bằng JS -->
            </div>
        </div>
        
        <!-- TRELLO COLUMN BOARD PLATFORM -->
        <main class="trello-board" id="trelloBoard">
            <!-- Inject tự động 3 cột từ JS -->
        </main>

        <footer>
            <p>&copy; 2026 PM Deck. Tailored for Professional Project Manager. Nguyen Trung Kien.</p>
        </footer>
    </div>

    <!-- Link to external JS -->
    <script src="script.js"></script>
</body>
</html>
